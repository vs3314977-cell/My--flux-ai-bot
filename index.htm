<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    </style>
</head>
<body>
    <h1>Welcome to My AI Assistant</h1>
    <p>Niche right side me chat icon par click karke baat karein!</p>

    <script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
    <script src="https://bpcontent.cloud" defer></script>
    
    <script>
        window.botpress.on('*', (event) => {
            if (event.type === 'webchat:ready') {
                const savedConversationId = localStorage.getItem('bp_chat_history_id');
                if (savedConversationId) {
                    window.botpress.sendPayload({
                        type: 'loadConversation',
                        payload: { id: savedConversationId }
                    });
                }
            }
            if (event.type === 'conversation:changed') {
                if (event.payload && event.payload.conversationId) {
                    localStorage.setItem('bp_chat_history_id', event.payload.conversationId);
                }
            }
        });
    </script>
</body>
</html>
